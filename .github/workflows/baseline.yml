name: Legacy baseline

on:
  push:
  pull_request:

jobs:
  recovered-skills:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install the locked baseline
        run: python -m pip install -r requirements-dev-macos.lock
      - name: Verify recovered skill contracts
        run: >-
          python -m pytest -q
          tests/test_skill_manager.py tests/test_skill_selector.py
          tests/test_skill_candidate_extractor.py tests/test_skill_maintenance.py
          tests/test_skill_source_recovery.py tests/test_52_integration.py
      - name: Verify startup and shutdown without user data
        timeout-minutes: 2
        run: python scripts/smoke_legacy_startup.py
      - name: Check recovered source quality
        run: |
          FILES="core/skills/skill_schema.py core/skills/skill_selector.py core/skills/skill_candidate_extractor.py core/skills/skill_validator.py tests/test_skill_source_recovery.py scripts/smoke_legacy_startup.py"
          python -m ruff check $FILES
          python -m black --check $FILES
          python -m mypy --explicit-package-bases --follow-imports=silent $FILES

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: bridge/dsh/package-lock.json
      - name: Verify DSH bridge types, transport and build
        run: |
          npm ci --prefix bridge/dsh --ignore-scripts
          npm test --prefix bridge/dsh
      - name: Verify Jev decision contracts without provider credentials
        run: |
          python -m pytest -q tests/test_jev.py
          FILES="core/agent/jev.py core/service/jev_protocol.py core/service/jev_notifications.py core/storage/jev_repo.py scripts/smoke_jev.py"
          python -m ruff check $FILES tests/test_jev.py
          python -m black --check $FILES tests/test_jev.py
          python -m mypy --explicit-package-bases --follow-imports=silent $FILES

      - name: Verify Python governance and protocol
        run: >-
          python -m pytest -q tests/test_dsh_tools.py tests/test_dsh_protocol.py
          tests/test_integration_phase1.py tests/test_tool_policy.py
          tests/test_temp_config_security.py
      - name: Check new DSH boundary quality
        run: |
          FILES="core/agent/dsh scripts/smoke_dsh_bridge.py tests/test_dsh_tools.py tests/test_dsh_protocol.py"
          python -m ruff check $FILES
          python -m black --check $FILES
          python -m mypy --explicit-package-bases --follow-imports=silent $FILES

      - name: Verify headless service and generated protocol
        run: |
          python -m pytest -q tests/test_headless_service.py tests/test_task_queue.py tests/test_focus_companion.py tests/test_task_manager_session.py
          bridge/dsh/node_modules/.bin/tsc --noEmit --strict --skipLibCheck --target es2023 shared/desktop-protocol.ts
      - name: Check headless source quality
        run: |
          FILES="app/service.py core/agent/contracts.py core/events/hook.py core/service core/storage/service_repo.py core/tasks/task_queue.py core/tasks/task_manager.py core/focus/focus_companion.py ui/domain_bridge.py scripts/generate_desktop_protocol.py scripts/smoke_headless_service.py tests/test_headless_service.py"
          python -m ruff check $FILES
          python -m black --check $FILES
          python -m mypy --explicit-package-bases --follow-imports=silent $FILES
      - name: Verify desktop types, packaged assets and service boundary
        run: |
          npm ci --prefix desktop --ignore-scripts
          LOBUDDY_PYTHON="$(command -v python)" npm test --prefix desktop
