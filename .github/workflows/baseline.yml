name: TypeScript validation

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  typescript:
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Require the qualified native architecture
        run: node -e "require('node:assert/strict').equal(process.platform + '/' + process.arch, 'darwin/arm64')"
      - name: Install locked dependencies without general lifecycle scripts
        run: |
          npm ci
          npm run setup:native
      - name: Verify source retirement, contracts and isolated business behavior
        run: |
          npm run check:retirement
          npm run check
      - name: Build and inspect an independent local package
        run: |
          npm run package:mac
          npm run verify:package
